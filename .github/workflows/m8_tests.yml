name: Planet Generator M8 Tests

on:
  workflow_dispatch:
  push:
    branches:
      - Generation-Upgrade
  pull_request:

jobs:
  regression:
    runs-on: self-hosted
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Godot version
        run: godot --version

      # .godot/ is intentionally ignored by Git. A clean CI checkout therefore
      # needs one import pass before scenes that reference global `class_name`
      # scripts can be executed reliably.
      - name: Import Godot project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --verbose --path . --import 2>&1 | tee godot_import.log

          # Godot can return 0 after an editor import even when a project script
          # failed to parse. Treat script/compiler diagnostics as a hard CI error.
          if grep -Eqi 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR: Failed to load script' godot_import.log; then
            echo 'Godot project import reported script errors:'
            grep -Ein 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR: Failed to load script' godot_import.log | tail -80
            exit 1
          fi

      - name: Verify Godot class cache
        shell: bash
        run: |
          test -f .godot/global_script_class_cache.cfg
          grep -q "PlanetGridContract" .godot/global_script_class_cache.cfg

      # M4 is intentionally small but depends on a global class. Fail quickly
      # here instead of letting every regression scene spend its full timeout.
      - name: Quick class-name smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . res://tests/milestone_4_coordinates.tscn 2>&1 | tee m4_class_smoke.log

      # M1 is the smallest regression that initializes the local RenderingDevice.
      # Run it once up front so a Vulkan/compute problem is reported immediately
      # rather than consuming the timeout of every GPU-dependent milestone.
      - name: Quick RenderingDevice smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . res://tests/milestone_1_smoke.tscn 2>&1 | tee m1_gpu_smoke.log

      - name: Run M8/M8.1 regression suite
        shell: bash
        run: |
          set -o pipefail
          python tools/run_m8_regression_suite.py "$(which godot)" --headless --timeout 180 2>&1 | tee m8_regression_console.log

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-regression-report
          path: |
            m8_regression_report.json
            godot_import.log
            m4_class_smoke.log
            m1_gpu_smoke.log
            m8_regression_console.log
            *.log
          if-no-files-found: ignore
